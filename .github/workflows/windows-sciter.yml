name: Build Windows Sciter (x64)

on:
  workflow_dispatch:          # 手动触发
  push:
    branches: [ master, main ]
    paths:
      - 'src/**'
      - 'libs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/windows-sciter.yml'
  pull_request:
    branches: [ master, main ]

env:
  SCITER_RUST_VERSION: "1.75"          # Sciter 对高版本 Rust 有 ABI 问题，必须用 1.75
  LLVM_VERSION: "15.0.6"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.1"                     # 可按需要修改

jobs:
  build-windows-sciter:
    name: Windows Sciter x64
    runs-on: windows-2022
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-sciter

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          $VCPKG_ROOT/vcpkg install \
            libvpx:x64-windows-static \
            libyuv:x64-windows-static \
            opus:x64-windows-static \
            aom:x64-windows-static \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"

      - name: Inline Sciter resources
        run: |
          python3 res/inline-sciter.py

      - name: Build Sciter version
        run: |
          # 使用 inline + hwcodec + vram
          cargo build --locked --release --features inline,hwcodec,vram --bins

      - name: Prepare Release folder
        run: |
          mkdir -p Release
          cp target/release/rustdesk.exe Release/
          
          # 下载 64-bit Sciter DLL
          curl -LJ -o Release/sciter.dll \
            https://raw.githubusercontent.com/c-smile/sciter-sdk/master/bin.win/x64/sciter.dll

          # 可选：下载虚拟显示器驱动（官方也带）
          curl -LJ -o usbmmidd_v2.zip \
            https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip
          unzip -o usbmmidd_v2.zip
          mv usbmmidd_v2 Release/ || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-sciter-x64
          path: |
            Release/rustdesk.exe
            Release/sciter.dll
            Release/usbmmidd_v2/
          if-no-files-found: error

      # 可选：生成便携版（portable）
      - name: Build portable (optional)
        if: false   # 改成 true 开启
        run: |
          sed -i '/dpiAware/d' res/manifest.xml || true
          pushd libs/portable
          pip3 install -r requirements.txt
          python3 generate.py -f ../../Release/ -o . -e ../../Release/rustdesk.exe
          popd
          mkdir -p SignOutput
          mv target/release/rustdesk-portable-packer.exe \
             SignOutput/rustdesk-${{ env.VERSION }}-x64-sciter.exe

      - name: Upload Portable
        if: false
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-sciter-portable
          path: SignOutput/
